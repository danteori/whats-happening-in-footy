[package]
name = "backend"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
